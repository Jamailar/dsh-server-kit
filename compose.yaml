services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh-server-kit:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional. New deployments default to base and configure the domain and
      # administrator through the first-open setup page.
      DSH_UI_PRESET: ${DSH_UI_PRESET:-base}
    volumes:
      - dsh-home:/data/dsh
      - dsh-server:/data/dsh-server
      - dsh-workspace:/workspace

volumes:
  dsh-home:
  dsh-server:
  dsh-workspace:
