services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh-server-kit:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional. New deployments default to base and configure the domain and
      # administrator through the first-open setup page.
      DSH_UI_PRESET: ${DSH_UI_PRESET:-base}
      # Optional. Use code to require a setup code from the first container log.
      DSH_SETUP_PROTECTION: ${DSH_SETUP_PROTECTION:-open}
    volumes:
      - dsh-data:/data

volumes:
  dsh-data:
